---
- name: Prepare lifecycle host
  hosts: all
  become: false
  tasks:
    - name: "Ensuring Podman configuration directory exists"
      ansible.builtin.file:
        path: /etc/containers
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Forcing vfs storage driver for nested Podman tests"
      ansible.builtin.copy:
        dest: /etc/containers/storage.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [storage]
          driver = "vfs"

- name: Ensure Podman installation is present
  hosts: all
  become: false
  vars:
    state: present
    podman_skip_container_guard: true
    iac_blueprint:
      podman:
        configuration:
          network:
            network_backend: "netavark"
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-rhel9-lifecycle"
            command: "sleep infinity"
  roles:
    - role: ansible-iac-role-podman

- name: Ensure lifecycle container is created
  hosts: all
  become: false
  vars:
    state: container_present
    podman_skip_container_guard: true
    iac_blueprint:
      podman:
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-rhel9-lifecycle"
            command: "sleep infinity"
  roles:
    - role: ansible-iac-role-podman
  post_tasks:
    - name: "Checking lifecycle container exists after create"
      ansible.builtin.command: >-
        podman inspect --format '{{ "{{ .State.Status }}" }}'
        molecule-rhel9-lifecycle
      register: podman_lifecycle_created_status
      changed_when: false

    - name: "Verifying lifecycle container create state"
      ansible.builtin.assert:
        that:
          - podman_lifecycle_created_status.rc == 0
          - podman_lifecycle_created_status.stdout in ["created", "configured", "exited"]
        fail_msg: "Lifecycle scenario failed to create container"

- name: Ensure lifecycle container is started
  hosts: all
  become: false
  vars:
    state: container_started
    podman_skip_container_guard: true
    iac_blueprint:
      podman:
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-rhel9-lifecycle"
            command: "sleep infinity"
  roles:
    - role: ansible-iac-role-podman
  post_tasks:
    - name: "Checking lifecycle container running state"
      ansible.builtin.command: >-
        podman inspect --format '{{ "{{ .State.Status }}" }}'
        molecule-rhel9-lifecycle
      register: podman_lifecycle_running_status
      changed_when: false

    - name: "Verifying lifecycle container started state"
      ansible.builtin.assert:
        that:
          - podman_lifecycle_running_status.stdout == "running"
        fail_msg: "Lifecycle scenario failed to start container"

- name: Ensure lifecycle container is stopped
  hosts: all
  become: false
  vars:
    state: container_stopped
    podman_skip_container_guard: true
    iac_blueprint:
      podman:
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-rhel9-lifecycle"
            command: "sleep infinity"
  roles:
    - role: ansible-iac-role-podman
  post_tasks:
    - name: "Checking lifecycle container stopped state"
      ansible.builtin.command: >-
        podman inspect --format '{{ "{{ .State.Status }}" }}'
        molecule-rhel9-lifecycle
      register: podman_lifecycle_stopped_status
      changed_when: false

    - name: "Verifying lifecycle container stopped state"
      ansible.builtin.assert:
        that:
          - podman_lifecycle_stopped_status.stdout in ["exited", "stopped"]
        fail_msg: "Lifecycle scenario failed to stop container"

- name: Ensure lifecycle container is running before removal safety check
  hosts: all
  become: false
  tasks:
    - name: "Starting lifecycle container before removal"
      ansible.builtin.command:
        argv: ["podman", "start", "molecule-rhel9-lifecycle"]
      changed_when: true

- name: Ensure lifecycle container is removed safely while running
  hosts: all
  become: false
  vars:
    state: container_absent
    podman_skip_container_guard: true
    iac_blueprint:
      podman:
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-rhel9-lifecycle"
            command: "sleep infinity"
  roles:
    - role: ansible-iac-role-podman

- name: Ensure rootful Quadlet runtime lifecycle
  hosts: all
  become: false
  vars:
    podman_skip_container_guard: true
    state: container_present
    podman_lifecycle_secret_value: 'space "quote" \\ backslash $HOME 100%'
    iac_blueprint:
      podman:
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-quadlet-lifecycle"
            command: "sleep infinity"
            quadlet: true
  roles:
    - role: ansible-iac-role-podman
  post_tasks:
    - name: "Checking generated Quadlet definition"
      ansible.builtin.stat:
        path: /etc/containers/systemd/molecule-quadlet-lifecycle.container
      register: podman_quadlet_definition

    - name: "Verifying rootful Quadlet definition exists"
      ansible.builtin.assert:
        that:
          - podman_quadlet_definition.stat.exists
          - podman_quadlet_definition.stat.mode == "0644"

- name: Ensure generated Quadlet service is started
  hosts: all
  become: false
  vars:
    podman_skip_container_guard: true
    state: container_started
    iac_blueprint:
      podman:
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-quadlet-lifecycle"
            command: "sleep infinity"
            quadlet: true
  roles:
    - role: ansible-iac-role-podman
  post_tasks:
    - name: "Checking generated Quadlet service state"
      ansible.builtin.command:
        argv: ["systemctl", "is-active", "molecule-quadlet-lifecycle.service"]
      changed_when: false
      register: podman_quadlet_service_active

    - name: "Checking generated Quadlet service enablement status"
      ansible.builtin.command:
        argv: ["systemctl", "is-enabled", "molecule-quadlet-lifecycle.service"]
      changed_when: false
      register: podman_quadlet_service_enabled

    - name: "Verifying generated Quadlet service is active"
      ansible.builtin.assert:
        that:
          - podman_quadlet_service_active.stdout == "active"
          - podman_quadlet_service_enabled.stdout in ["enabled", "generated"]

- name: Repeat Quadlet converge
  hosts: all
  become: false
  vars:
    podman_skip_container_guard: true
    state: container_present
    iac_blueprint:
      podman:
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-quadlet-lifecycle"
            command: "sleep infinity"
            quadlet: true
  tasks:
    - name: "Converging existing Quadlet definition again"
      ansible.builtin.include_role:
        name: ansible-iac-role-podman

- name: Stop and remove rootful Quadlet resource
  hosts: all
  become: false
  vars:
    podman_skip_container_guard: true
    state: container_stopped
    iac_blueprint:
      podman:
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-quadlet-lifecycle"
            command: "sleep infinity"
            quadlet: true
  roles:
    - role: ansible-iac-role-podman
  post_tasks:
    - name: "Checking generated Quadlet unit state after stop"
      ansible.builtin.command:
        argv: ["systemctl", "show", "--property=ActiveState", "--value", "molecule-quadlet-lifecycle.service"]
      register: podman_quadlet_service_stopped
      changed_when: false
      failed_when: false
    - name: "Checking generated Quadlet unit result after stop"
      ansible.builtin.command:
        argv: ["systemctl", "show", "--property=Result", "--value", "molecule-quadlet-lifecycle.service"]
      register: podman_quadlet_service_result
      changed_when: false
      failed_when: false
    - name: "Checking generated Quadlet unit exit status after stop"
      ansible.builtin.command:
        argv: ["systemctl", "show", "--property=ExecMainStatus", "--value", "molecule-quadlet-lifecycle.service"]
      register: podman_quadlet_service_exit_status
      changed_when: false
      failed_when: false
    - name: "Checking Quadlet container is no longer running"
      ansible.builtin.command:
        argv: ["podman", "inspect", "--format", "{{ '{{ .State.Status }}' }}", "molecule-quadlet-lifecycle"]
      register: podman_quadlet_container_stopped
      changed_when: false
      failed_when: false
    - name: "Asserting generated Quadlet service stop contract"
      ansible.builtin.assert:
        that:
          - podman_quadlet_service_stopped.rc == 0
          - podman_quadlet_service_result.rc == 0
          - podman_quadlet_service_exit_status.rc == 0
          - podman_quadlet_container_stopped.rc != 0 or podman_quadlet_container_stopped.stdout != "running"
          - podman_quadlet_service_stopped.stdout in ["inactive", "failed"]
          - podman_quadlet_service_stopped.stdout != "failed" or
            (podman_quadlet_service_result.stdout == "exit-code" and
             podman_quadlet_service_exit_status.stdout == "137")
        fail_msg: >-
          Expected container stopped/removed and service inactive, or narrowly
          failed from SIGKILL (exit-code 137); systemd rc={{ podman_quadlet_service_stopped.rc }}/
          {{ podman_quadlet_service_result.rc }}/{{ podman_quadlet_service_exit_status.rc }},
          stdout={{ podman_quadlet_service_stopped.stdout | to_json }}/
          {{ podman_quadlet_service_result.stdout | to_json }}/{{ podman_quadlet_service_exit_status.stdout | to_json }},
          stderr={{ podman_quadlet_service_stopped.stderr | to_json }}/
          {{ podman_quadlet_service_result.stderr | to_json }}/{{ podman_quadlet_service_exit_status.stderr | to_json }};
          Podman rc={{ podman_quadlet_container_stopped.rc }}, stdout={{ podman_quadlet_container_stopped.stdout | to_json }},
          stderr={{ podman_quadlet_container_stopped.stderr | to_json }}
    - name: "Removing rootful Quadlet resource"
      ansible.builtin.include_role:
        name: ansible-iac-role-podman
      vars:
        state: container_absent
    - name: "Checking Quadlet definition was removed"
      ansible.builtin.stat:
        path: /etc/containers/systemd/molecule-quadlet-lifecycle.container
      register: podman_quadlet_definition_after_removal
    - name: "Verifying Quadlet definition was removed"
      ansible.builtin.assert:
        that:
          - not podman_quadlet_definition_after_removal.stat.exists

- name: Exercise private direct-container environment handling
  hosts: all
  become: false
  vars:
    podman_skip_container_guard: true
    state: container_present
    podman_lifecycle_secret_value: 'space "quote" \\ backslash $HOME 100%'
    iac_blueprint:
      podman:
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-direct-secret"
            command: ["sleep", "infinity"]
            environment:
              MOLECULE_SYNTHETIC_ONLY: "{{ podman_lifecycle_secret_value }}"
  roles:
    - role: ansible-iac-role-podman
  post_tasks:
    - name: "Verify direct create argv contains no synthetic environment value"
      ansible.builtin.assert:
        that:
          - "'--env-file' in podman_container_create_argv"
          - "'--env' not in podman_container_create_argv"
          - "'space \"quote\" \\\\ backslash $HOME 100%' not in podman_container_create_argv"
        fail_msg: "Direct create argv exposed a synthetic environment value"
      no_log: true
    - name: "Verify direct temporary environment directory was removed"
      ansible.builtin.stat:
        path: "{{ podman_environment_directory.path }}"
      register: podman_direct_environment_temp
    - name: "Assert direct temporary environment cleanup"
      ansible.builtin.assert:
        that:
          - not podman_direct_environment_temp.stat.exists
    - name: "Inspect direct container environment without exposing captured data"
      ansible.builtin.command:
        argv: ["podman", "inspect", "--format", "{{ '{{range .Config.Env}}{{println .}}{{end}}' }}", "molecule-direct-secret"]
      register: podman_direct_secret_environment
      changed_when: false
      no_log: true
    - name: "Verify direct-mode environment was preserved"
      ansible.builtin.assert:
        that:
          - "('MOLECULE_SYNTHETIC_ONLY=' ~ podman_lifecycle_secret_value) in podman_direct_secret_environment.stdout"
        fail_msg: "Direct-mode environment value was not preserved in the container"
      no_log: true

- name: Verify direct environment repeat and document creation-time semantics
  hosts: all
  become: false
  vars:
    podman_skip_container_guard: true
    state: container_present
    podman_lifecycle_secret_value: 'space "quote" \\ backslash $HOME 100%'
    iac_blueprint:
      podman:
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-direct-secret"
            command: ["sleep", "infinity"]
            environment:
              MOLECULE_SYNTHETIC_ONLY: 'updated value is not applied without recreating the container'
  tasks:
    - name: "Repeating direct-container convergence with changed source environment"
      ansible.builtin.include_role:
        name: ansible-iac-role-podman
    - name: "Inspect direct container environment without exposing captured data"
      ansible.builtin.command:
        argv: ["podman", "inspect", "--format", "{{ '{{range .Config.Env}}{{println .}}{{end}}' }}", "molecule-direct-secret"]
      register: podman_direct_secret_environment
      changed_when: false
      no_log: true
    - name: "Verify direct-mode environment remains creation-time state"
      ansible.builtin.assert:
        that:
          - "('MOLECULE_SYNTHETIC_ONLY=' ~ podman_lifecycle_secret_value) in podman_direct_secret_environment.stdout"
        fail_msg: "Direct-mode environment unexpectedly changed without container recreation"
      no_log: true
    - name: "Removing direct-mode test container"
      ansible.builtin.include_role:
        name: ansible-iac-role-podman
      vars:
        state: container_absent

- name: Exercise Quadlet secret environment update and cleanup
  hosts: all
  become: false
  vars:
    podman_skip_container_guard: true
    state: container_present
    podman_lifecycle_secret_value: 'space "quote" \\ backslash $HOME 100%'
    iac_blueprint:
      podman:
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-quadlet-secret"
            command: ["sleep", "infinity"]
            quadlet: true
            environment:
              MOLECULE_SYNTHETIC_ONLY: "{{ podman_lifecycle_secret_value }}"
  roles:
    - role: ansible-iac-role-podman
  post_tasks:
    - name: "Checking protected Quadlet environment file"
      ansible.builtin.stat:
        path: /etc/containers/systemd/molecule-quadlet-secret.env
      register: podman_quadlet_secret_file
    - name: "Verifying Quadlet environment file is private"
      ansible.builtin.assert:
        that:
          - podman_quadlet_secret_file.stat.exists
          - podman_quadlet_secret_file.stat.mode == "0600"
          - podman_quadlet_secret_file.stat.pw_name == "root"
          - podman_quadlet_secret_file.stat.gr_name == "root"
    - name: "Starting secret-bearing Quadlet service"
      ansible.builtin.systemd:
        name: molecule-quadlet-secret.service
        state: started
    - name: "Recording protected environment file checksum before repeat"
      ansible.builtin.stat:
        path: /etc/containers/systemd/molecule-quadlet-secret.env
        checksum_algorithm: sha256
      register: podman_quadlet_secret_file_before_repeat
    - name: "Repeating Quadlet convergence with unchanged synthetic environment"
      ansible.builtin.include_role:
        name: ansible-iac-role-podman
    - name: "Checking protected environment file checksum after repeat"
      ansible.builtin.stat:
        path: /etc/containers/systemd/molecule-quadlet-secret.env
        checksum_algorithm: sha256
      register: podman_quadlet_secret_file_after_repeat
    - name: "Verifying repeated Quadlet convergence preserved environment file"
      ansible.builtin.assert:
        that:
          - podman_quadlet_secret_file_before_repeat.stat.checksum == podman_quadlet_secret_file_after_repeat.stat.checksum
    - name: "Inspect Quadlet container environment without exposing captured data"
      ansible.builtin.command:
        argv: ["podman", "inspect", "--format", "{{ '{{range .Config.Env}}{{println .}}{{end}}' }}", "molecule-quadlet-secret"]
      register: podman_quadlet_secret_environment
      changed_when: false
      no_log: true
    - name: "Verify Quadlet environment was preserved"
      ansible.builtin.assert:
        that:
          - "('MOLECULE_SYNTHETIC_ONLY=' ~ podman_lifecycle_secret_value) in podman_quadlet_secret_environment.stdout"
        fail_msg: "Quadlet environment value was not preserved in the container"
      no_log: true

- name: Update Quadlet environment and verify restart
  hosts: all
  become: false
  vars:
    podman_skip_container_guard: true
    state: container_present
    iac_blueprint:
      podman:
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-quadlet-secret"
            command: ["sleep", "infinity"]
            quadlet: true
            environment:
              MOLECULE_SYNTHETIC_ONLY: 'updated value with "quotes" and 100%'
  roles:
    - role: ansible-iac-role-podman
  post_tasks:
    - name: "Inspect updated Quadlet container environment without exposing captured data"
      ansible.builtin.command:
        argv: ["podman", "inspect", "--format", "{{ '{{range .Config.Env}}{{println .}}{{end}}' }}", "molecule-quadlet-secret"]
      register: podman_quadlet_secret_environment
      changed_when: false
      no_log: true
    - name: "Verify updated Quadlet value reached the running container"
      ansible.builtin.assert:
        that:
          - "'MOLECULE_SYNTHETIC_ONLY=updated value with \"quotes\" and 100%' in podman_quadlet_secret_environment.stdout"
        fail_msg: "Updated Quadlet environment value was not applied"
      no_log: true
    - name: "Converging Quadlet secret definition a second time"
      ansible.builtin.include_role:
        name: ansible-iac-role-podman
    - name: "Removing Quadlet environment from desired configuration"
      ansible.builtin.include_role:
        name: ansible-iac-role-podman
      vars:
        iac_blueprint:
          podman:
            containers:
              - image: "docker.io/library/alpine:latest"
                parameters:
                  name: "molecule-quadlet-secret"
                command: ["sleep", "infinity"]
                quadlet: true
    - name: "Checking stale Quadlet environment was removed"
      ansible.builtin.stat:
        path: /etc/containers/systemd/molecule-quadlet-secret.env
      register: podman_quadlet_secret_file_after_cleanup
    - name: "Verifying stale Quadlet environment file is absent"
      ansible.builtin.assert:
        that:
          - not podman_quadlet_secret_file_after_cleanup.stat.exists
    - name: "Switching secret container from Quadlet to direct management"
      ansible.builtin.include_role:
        name: ansible-iac-role-podman
      vars:
        iac_blueprint:
          podman:
            containers:
              - image: "docker.io/library/alpine:latest"
                parameters:
                  name: "molecule-quadlet-secret"
                command: ["sleep", "infinity"]
                environment:
                  MOLECULE_SYNTHETIC_ONLY: 'direct-mode transition'
    - name: "Checking Quadlet files were removed on mode transition"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/containers/systemd/molecule-quadlet-secret.container
        - /etc/containers/systemd/molecule-quadlet-secret.env
      register: podman_quadlet_files_after_transition
    - name: "Verifying stale Quadlet files are absent after mode transition"
      ansible.builtin.assert:
        that:
          - not item.stat.exists
      loop: "{{ podman_quadlet_files_after_transition.results }}"
    - name: "Removing Quadlet secret test container"
      ansible.builtin.include_role:
        name: ansible-iac-role-podman
      vars:
        state: container_absent

- name: Verify secret-bearing direct create failures are censored and cleaned up
  hosts: all
  become: false
  vars:
    podman_skip_container_guard: true
    state: container_present
    podman_lifecycle_failure_secret: "synthetic-direct-failure-secret"
    iac_blueprint:
      podman:
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-direct-failure"
              definitely_not_a_podman_option: true
            command: ["sleep", "infinity"]
            environment:
              MOLECULE_SYNTHETIC_ONLY: "{{ podman_lifecycle_failure_secret }}"
  tasks:
    - name: "Expect direct create to fail with its environment protected"
      block:
        - name: "Attempt direct container creation"
          ansible.builtin.include_role:
            name: ansible-iac-role-podman
      rescue:
        - name: "Verify the direct container creation task failed"
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == "Ensuring container is present"
              - ansible_failed_task.no_log | default(false) | bool
            fail_msg: "Failure was not raised by the direct container creation task"
        - name: "Record expected direct create failure without exposing it"
          ansible.builtin.set_fact:
            podman_direct_failure_caught: true
      always:
        - name: "Check direct temporary environment directory was removed"
          ansible.builtin.stat:
            path: "{{ podman_environment_directory.path }}"
          register: podman_direct_failure_temp
          when: podman_environment_directory is defined
        - name: "Remove any failed direct test container"
          ansible.builtin.command:
            argv: ["podman", "rm", "--force", "molecule-direct-failure"]
          changed_when: false
          failed_when: false
    - name: "Verify direct create failed and its temporary files were removed"
      ansible.builtin.assert:
        that:
          - podman_direct_failure_caught | default(false)
          - podman_direct_failure_temp is defined
          - not podman_direct_failure_temp.stat.exists
        fail_msg: "Expected a censored direct create failure and complete temp cleanup"

- name: Verify secret-bearing Quadlet systemd application failures are censored
  hosts: all
  become: false
  vars:
    podman_skip_container_guard: true
    state: container_present
    podman_lifecycle_failure_secret: "synthetic-quadlet-failure-secret"
    iac_blueprint:
      podman:
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-quadlet-failure"
            command: ["/bin/false"]
            quadlet: true
            environment:
              MOLECULE_SYNTHETIC_ONLY: "{{ podman_lifecycle_failure_secret }}"
  tasks:
    - name: "Expect Quadlet service application to fail with its environment protected"
      block:
        - name: "Attempt to apply failing Quadlet service"
          ansible.builtin.include_role:
            name: ansible-iac-role-podman
      rescue:
        - name: "Verify Quadlet service application task failed"
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == "Applying generated Quadlet service"
              - ansible_failed_task.no_log | default(false) | bool
            fail_msg: "Failure was not raised while applying the generated Quadlet service"
        - name: "Record expected Quadlet application failure without exposing it"
          ansible.builtin.set_fact:
            podman_quadlet_failure_caught: true
      always:
        - name: "Remove failed Quadlet service and role-owned files"
          ansible.builtin.command:
            argv: ["systemctl", "stop", "molecule-quadlet-failure.service"]
          changed_when: false
          failed_when: false
        - name: "Remove failed Quadlet container"
          ansible.builtin.command:
            argv: ["podman", "rm", "--force", "molecule-quadlet-failure"]
          changed_when: false
          failed_when: false
        - name: "Remove failed Quadlet source and environment files"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/containers/systemd/molecule-quadlet-failure.container
            - /etc/containers/systemd/molecule-quadlet-failure.env
            - /etc/containers/systemd/.molecule-quadlet-failure.container.ansible-managed
            - /etc/containers/systemd/.molecule-quadlet-failure.env.ansible-managed
        - name: "Reload systemd and reset failed Quadlet service"
          ansible.builtin.command:
            argv: ["systemctl", "daemon-reload"]
          changed_when: false
          failed_when: false
        - name: "Reset failed Quadlet service state"
          ansible.builtin.command:
            argv: ["systemctl", "reset-failed", "molecule-quadlet-failure.service"]
          changed_when: false
          failed_when: false
    - name: "Check failed Quadlet files were removed"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/containers/systemd/molecule-quadlet-failure.container
        - /etc/containers/systemd/molecule-quadlet-failure.env
        - /etc/containers/systemd/.molecule-quadlet-failure.container.ansible-managed
        - /etc/containers/systemd/.molecule-quadlet-failure.env.ansible-managed
      register: podman_quadlet_failure_cleanup_stat
    - name: "Check failed Quadlet service reset state"
      ansible.builtin.command:
        argv: ["systemctl", "show", "--property=ActiveState", "--value", "molecule-quadlet-failure.service"]
      register: podman_quadlet_failure_unit_active
      changed_when: false
      failed_when: false
    - name: "Check failed Quadlet service result reset"
      ansible.builtin.command:
        argv: ["systemctl", "show", "--property=Result", "--value", "molecule-quadlet-failure.service"]
      register: podman_quadlet_failure_unit_result
      changed_when: false
      failed_when: false
    - name: "Verify Quadlet application failure and cleanup"
      ansible.builtin.assert:
        that:
          - podman_quadlet_failure_caught | default(false)
          - podman_quadlet_failure_cleanup_stat.results | map(attribute='stat.exists') | select('equalto', true) | list | length == 0
          - podman_quadlet_failure_unit_active.rc == 0
          - podman_quadlet_failure_unit_active.stdout == "inactive"
          - podman_quadlet_failure_unit_result.rc == 0
          - podman_quadlet_failure_unit_result.stdout == "success"
        fail_msg: "Expected a censored Quadlet systemd application failure"
