---
###############################################################################
#
# present.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# SETTING VARIABLES
###############################################################################


###############################################################################
# INSTALLING PODMAN
###############################################################################

- name: "Ensuring podman package is installed"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    iac_package: "podman"

- name: "Ensuring Podman network helper packages are installed"
  ansible.builtin.include_tasks: package_present.yml
  loop:
    - "slirp4netns"
    - "passt"
  loop_control:
    loop_var: iac_package

###############################################################################
# ENSURING DEFAULT CONFIGURATION
###############################################################################

- name: "Rendering configuration lines"
  ansible.builtin.set_fact:
    podman_rendered_network_configuration: |
      [network]
      {% for item in podman_network_configuration | dict2items if item.value is not none %}
      {% if item.value is string %}
      {{ item.key }} = "{{ item.value }}"
      {% else %}
      {{ item.key }} = {{ item.value }}
      {% endif %}
      {% endfor %}
  when: podman_network_configuration is defined

- name: "Reading existing Podman configuration before network update"
  ansible.builtin.slurp:
    path: "{{ podman_containers_conf }}"
  register: podman_existing_containers_conf
  failed_when: false
  when: podman_rendered_network_configuration is defined

- name: "Checking for unmanaged duplicate Podman network section"
  ansible.builtin.set_fact:
    podman_unmanaged_network_section: >-
      {{
        (
          podman_existing_containers_conf.content | default('') | b64decode
          | regex_replace('(?ms)^# BEGIN ANSIBLE-IAC-ROLE-PODMAN NETWORK CONFIGURATION\\n.*?^# END ANSIBLE-IAC-ROLE-PODMAN NETWORK CONFIGURATION\\n?', '')
        ) is search('(?m)^\\s*\\[network\\]\\s*$')
      }}
  when: podman_rendered_network_configuration is defined

- name: "Rejecting unmanaged duplicate Podman network section"
  ansible.builtin.assert:
    that:
      - not (podman_unmanaged_network_section | bool)
    fail_msg: >-
      {{ podman_containers_conf }} already contains an unmanaged [network]
      section. Refusing to create duplicate TOML sections; merge it into the
      role-managed network block before convergence.
  when: podman_rendered_network_configuration is defined

- name: "Ensuring Podman configuration"
  ansible.builtin.blockinfile:
    dest: "{{ podman_containers_conf }}"
    create: true
    block: "{{ podman_rendered_network_configuration }}"
    marker: "# {mark} ANSIBLE-IAC-ROLE-PODMAN NETWORK CONFIGURATION"
    mode: "0640"
    owner: "root"
    group: "root"
  when: podman_rendered_network_configuration is defined

###############################################################################
# ENSURING FILESYSTEM CONFIGURATION
###############################################################################

- name: "Ensuring bind mount configuration is present"
  ansible.builtin.include_tasks: bind_present.yml
  when: (iac_blueprint.podman.binds | default([])) | length > 0
  vars:
    iac_fs_binds: "{{ iac_blueprint.podman.binds | default([]) }}"

- name: "Ensuring filesystem configuration is present"
  ansible.builtin.include_tasks: fs_present.yml
  when: (iac_blueprint.podman.directories | default([])) | length > 0 or (iac_blueprint.podman.files | default([])) | length > 0
  vars:
    iac_fs_directories: "{{ iac_blueprint.podman.directories | default([]) }}"
    iac_fs_files: "{{ iac_blueprint.podman.files | default([]) }}"

###############################################################################
# ENSURING CRONJOB CONFIGURATION
###############################################################################

- name: "Ensuring cron package is installed"
  ansible.builtin.include_tasks: package_present.yml
  when: iac_blueprint.podman.cron is defined
  vars:
    iac_package: "cronie"

- name: "Ensuring filesystem configuration is present"
  ansible.builtin.include_tasks: cron_present.yml
  when: iac_blueprint.podman.cron is defined
  vars:
    iac_cron: "{{ iac_blueprint.podman.cron | default([]) }}"
