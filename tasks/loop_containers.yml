---
###############################################################################
#
# loop_containers.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Checking if required variables are defined"
  ansible.builtin.assert:
    that:
      - podman_containers is defined
    fail_msg: "All tests did not pass"

###############################################################################
# LOOPING THROUGH SITES TO BE ADDED
###############################################################################

- name: "Looping through containers"
  ansible.builtin.include_tasks:
    file: "{{ task_state }}.yml"
    apply:
      no_log: true
  loop: "{{ podman_containers }}"
  loop_control:
    loop_var: podman_container_record
    label: "container operation"
  # Included tasks may resolve environment values and construct private argv.
  # Suppress both loop item rendering and every nested task result/error.
  no_log: true
