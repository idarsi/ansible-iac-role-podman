---
###############################################################################
#
# main.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# CHECKING REQUIREMENTS
###############################################################################

- name: "Checking if operating system is supported"
  ansible.builtin.fail:
    msg: "Unsupported operating system: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
  when: >
    iac_supported_os | selectattr('name', 'equalto', ansible_facts['distribution'])
                     | selectattr('versions', 'contains', ansible_facts['distribution_major_version'])
                     | list
                     | length == 0

- name: "Checking Podman blueprint execution context"
  ansible.builtin.assert:
    that:
      - iac_blueprint is defined
    fail_msg: "iac_blueprint is not defined"

- name: "Checking Podman blueprint root type"
  ansible.builtin.assert:
    that:
      - iac_blueprint | type_debug == "dict"
    fail_msg: "iac_blueprint must be a mapping containing podman"

- name: "Checking Podman service blueprint"
  ansible.builtin.assert:
    that:
      - iac_blueprint.podman is defined
    fail_msg: "iac_blueprint.podman is not defined"

- name: "Setting IaC state"
  ansible.builtin.set_fact:
    iac_state: "{{ state | default('present') }}"

- name: "Validating complete Podman blueprint"
  ansible.builtin.include_tasks: validate_blueprint.yml

- name: "Checking if we are in container"
  ansible.builtin.meta: end_play
  when:
    - iac_state != 'validate'
    - ansible_facts["virtualization_type"] | default("") in ["docker", "podman", "lxc"]
    - not (podman_skip_container_guard | default(false) | bool)

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Setting what containers are to be configured"
  ansible.builtin.set_fact:
    podman_containers: "{{ iac_blueprint.podman.containers | default([]) }}"
    podman_network_configuration: "{{ iac_blueprint.podman.configuration.network | default(omit) }}"

- name: "Checking proxy address if it's defined"
  ansible.builtin.set_fact:
    proxy_host: "{{ (http_proxy | regex_replace('^https?://', '')).split(':')[0] }}"
    proxy_port: "{{ (http_proxy | regex_replace('^https?://', '')).split(':')[1] | int }}"
  when: >
    iac_state != 'validate' and
    (
      (http_proxy is defined and http_proxy != "")
      or (https_proxy is defined and https_proxy != "")
    )
    and (inventory_hostname not in (no_proxy | default("") | split(",")))

- name: "Checking that proxy connection is working if it's defined"
  ansible.builtin.wait_for:
    host: "{{ proxy_host }}"
    port: "{{ proxy_port }}"
    state: "started"
    timeout: 3
  when: >
    iac_state != 'validate' and
    (
      (http_proxy is defined and http_proxy != "")
      or (https_proxy is defined and https_proxy != "")
    )
    and (inventory_hostname not in (no_proxy | default("") | split(",")))

###############################################################################
# CHECKING STATES
###############################################################################

- name: "STATE: Ensure all installation is done"
  ansible.builtin.include_tasks: install.yml
  when: iac_state == 'install'

- name: "STATE: Validate Podman blueprint without changing the host"
  ansible.builtin.debug:
    msg: "Podman blueprint validation succeeded"
  when: iac_state == 'validate'

- name: "STATE: Ensure all installation is gone"
  ansible.builtin.include_tasks: uninstall.yml
  when: iac_state == 'uninstall'

- name: "STATE: Ensure Podman installation is present"
  ansible.builtin.include_tasks: present.yml
  when: iac_state == 'present'

- name: "STATE: Ensure Podman installation is absent"
  ansible.builtin.include_tasks: absent.yml
  when: iac_state == 'absent'

- name: "STATE: Ensure container is present"
  ansible.builtin.include_tasks: loop_containers.yml
  vars:
    task_state: "container_present"
  when: iac_state == 'container_present'

- name: "STATE: Ensure container is absent"
  ansible.builtin.include_tasks: loop_containers.yml
  vars:
    task_state: "container_absent"
  when: iac_state == 'container_absent'

- name: "STATE: Ensure container is present"
  ansible.builtin.include_tasks: loop_containers.yml
  vars:
    task_state: "container_started"
  when: iac_state == 'container_started'

- name: "STATE: Ensure container is absent"
  ansible.builtin.include_tasks: loop_containers.yml
  vars:
    task_state: "container_stopped"
  when: iac_state == 'container_stopped'
