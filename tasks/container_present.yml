---
###############################################################################
#
# container_present.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Checking if required variables are defined"
  ansible.builtin.assert:
    that:
      - podman_container_record is defined
    fail_msg: "All tests did not pass"

- name: "Resolving optional container preset"
  ansible.builtin.set_fact:
    podman_container_effective: >-
      {{
        (
          podman_container_presets[podman_container_record.preset]
          if (podman_container_record.preset is defined and podman_container_record.preset is not none)
          else {}
        ) | combine(podman_container_record, recursive=True)
      }}

- name: "Checking that container image or preset is valid"
  ansible.builtin.assert:
    that:
      - podman_container_effective.image is defined
      - (podman_container_effective.image | string | trim) != ""
      - podman_container_effective.parameters is defined
      - podman_container_effective.parameters.name is defined
      - (podman_container_effective.parameters.name | string | trim) != ""
      - >-
        (podman_container_effective.parameters.name | string | trim) is
        match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - >
        (
          podman_container_record.preset is not defined
          or podman_container_record.preset is none
          or podman_container_record.preset in podman_container_presets
        )
    fail_msg: >-
      Podman container must define image directly or use a known preset from
      podman_container_presets (requested preset:
      {{ podman_container_record.preset | default('none') }})

###############################################################################
# ENSURING CONTAINER IS PRESENT
###############################################################################

- name: "Removing role-managed Quadlet definition when switching to direct management"
  when: not (podman_container_effective.quadlet | default(false) | bool)
  block:
    - name: "Validating rootful Quadlet path before removal"
      ansible.builtin.include_tasks: quadlet_validate_path.yml

    - name: "Checking for role-managed Quadlet definition"
      ansible.builtin.stat:
        path: "/etc/containers/systemd/{{ podman_container_effective.parameters.name }}.container"
        follow: false
      register: podman_quadlet_source

    - name: "Verifying ownership before removing Quadlet definition"
      ansible.builtin.include_tasks: quadlet_assert_owned.yml
      vars:
        podman_quadlet_unit_path: "/etc/containers/systemd/{{ podman_container_effective.parameters.name }}.container"
      when: podman_quadlet_source.stat.exists

    - name: "Stopping generated Quadlet service before switching management mode"
      ansible.builtin.systemd:
        name: "{{ podman_container_effective.parameters.name }}.service"
        state: stopped
      when: podman_quadlet_source.stat.exists

    - name: "Removing role-managed Quadlet definition"
      ansible.builtin.file:
        path: "/etc/containers/systemd/{{ podman_container_effective.parameters.name }}.container"
        state: absent
      when: podman_quadlet_source.stat.exists

    - name: "Reloading systemd after Quadlet definition removal"
      ansible.builtin.systemd:
        daemon_reload: true
      when: podman_quadlet_source.stat.exists
- name: "Building safe Podman create argv"
  ansible.builtin.include_tasks: container_create_argv.yml
  when: not (podman_container_effective.quadlet | default(false) | bool)

- name: "Managing rootful Quadlet container unit"
  ansible.builtin.include_tasks: quadlet_container_present.yml
  when: podman_container_effective.quadlet | default(false) | bool

- name: "Checking container status"
  ansible.builtin.command:
    argv:
      - "podman"
      - "inspect"
      - "--format"
      - "{{ '{{ .State.Status }}' }}"
      - "{{ podman_container_effective.parameters.name }}"
  register: container_active
  changed_when: false
  failed_when: false
  when: not (podman_container_effective.quadlet | default(false) | bool)

- name: "Ensuring container is present"
  ansible.builtin.command:
    argv: "{{ podman_container_create_argv }}"
  changed_when: true
  environment:
    http_proxy: "{{ http_proxy | default(omit) }}"
    https_proxy: "{{ https_proxy | default(omit) }}"
    no_proxy: "{{ no_proxy | default(omit) }}"
  when:
    - not (podman_container_effective.quadlet | default(false) | bool)
    - container_active.rc != 0
