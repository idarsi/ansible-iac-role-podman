---
- name: "Exercise verbose Quadlet repeat and legacy migration on disposable hosts"
  hosts: all
  become: false
  vars:
    podman_skip_container_guard: true
    state: "container_present"
    iac_blueprint:
      podman:
        containers:
          - image: "docker.io/library/alpine:latest"
            parameters:
              name: "molecule-output-secret"
            command: ["sleep", "infinity"]
            quadlet: true
            environment:
              SYNTHETIC_ONLY: "OUTPUT_REGRESSION_CURRENT_4927"
  tasks:
    - name: "Exercise secret output boundaries"
      block:
        - name: "Create secret-bearing Quadlet"
          ansible.builtin.include_role:
            name: "ansible-iac-role-podman"
        - name: "Repeat secret-bearing Quadlet"
          ansible.builtin.include_role:
            name: "ansible-iac-role-podman"
        - name: "Seed legacy inline environment in owned unit"
          ansible.builtin.lineinfile:
            path: "/etc/containers/systemd/molecule-output-secret.container"
            insertafter: '^\[Container\]$'
            line: "Environment=LEGACY_ONLY=OUTPUT_REGRESSION_LEGACY_8361"
          no_log: true
          diff: false
        - name: "Migrate legacy inline environment without leaking old diff"
          ansible.builtin.include_role:
            name: "ansible-iac-role-podman"
        - name: "Check migration removed inline environment"
          ansible.builtin.command:
            argv: ["grep", "-q", "^Environment=", "/etc/containers/systemd/molecule-output-secret.container"]
          register: podman_inline_environment
          changed_when: false
          failed_when: podman_inline_environment.rc != 1
          no_log: true
      always:
        - name: "Remove output regression container"
          ansible.builtin.include_role:
            name: "ansible-iac-role-podman"
          vars:
            state: "container_absent"
    - name: "Report successful output regression completion"
      ansible.builtin.debug:
        msg: "{{ ['PODMAN', 'OUTPUT', 'REGRESSION', 'COMPLETE', '49278361'] | join('_') }}"
