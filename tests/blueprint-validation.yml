---
- name: Validate public validate state through role entrypoint
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    state: validate
    iac_supported_os:
      - name: "{{ ansible_facts['distribution'] }}"
        versions: ["{{ ansible_facts['distribution_major_version'] }}"]
    podman_container_presets:
      rhel9:
        image: "registry.access.redhat.com/ubi9-init"
        parameters:
          name: "rhel9"
    podman_create_parameter_keys: [name, hostname, ip, publish, privileged, systemd, volume, network, tty, interactive, user]
    # This unreachable proxy would fail the role's runtime precondition outside validate.
    http_proxy: "http://127.0.0.1:1"
    https_proxy: ""
    no_proxy: ""
    iac_blueprint:
      podman:
        containers:
          - preset: rhel9
            parameters:
              publish: ["8080:80"]
  tasks:
    - name: Run validation-only public role state
      ansible.builtin.include_tasks: ../tasks/main.yml

- name: Validate Podman blueprint contract without host changes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    podman_container_presets:
      rhel9:
        image: registry.access.redhat.com/ubi9-init
        parameters:
          name: preset-container
    podman_create_parameter_keys: [name, publish, volume, privileged]
    iac_state: container_present
    iac_blueprint:
      podman:
        containers:
          - preset: rhel9
            parameters:
              publish: ["8080:80"]
  tasks:
    - name: Valid preset-derived image and publish values pass
      ansible.builtin.include_tasks: ../tasks/validate_blueprint.yml

    - name: Quadlet record with supported translated options passes schema validation
      ansible.builtin.include_tasks: ../tasks/validate_blueprint.yml
      vars:
        iac_blueprint:
          podman:
            containers:
              - image: example/image
                quadlet: true
                parameters:
                  name: quadlet-valid
                  publish: ["8080:80"]

    - name: Quadlet newline injection in environment is rejected
      block:
        - name: Validate newline-bearing environment value
          ansible.builtin.include_tasks: ../tasks/validate_blueprint.yml
          vars:
            iac_blueprint:
              podman:
                containers:
                  - image: example/image
                    quadlet: true
                    parameters:
                      name: quadlet-injection
                    environment:
                      SAFE: "value\nExecStart=/bin/evil"
        - name: Fail if newline injection was accepted
          ansible.builtin.fail:
            msg: "Quadlet newline injection unexpectedly passed validation"
      rescue:
        - name: Confirm newline injection was rejected precisely
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results[0].msg == "Quadlet content values must not contain newline or other control characters."

    - name: Quadlet environment key directive injection is rejected by schema
      block:
        - name: Validate directive-bearing environment key
          ansible.builtin.include_tasks: ../tasks/validate_blueprint.yml
          vars:
            iac_blueprint:
              podman:
                containers:
                  - image: example/image
                    quadlet: true
                    parameters:
                      name: quadlet-key-injection
                    environment:
                      "SAFE\nExecStart=...": harmless
        - name: Fail if directive-bearing environment key was accepted
          ansible.builtin.fail:
            msg: "Quadlet environment key injection unexpectedly passed validation"
      rescue:
        - name: Confirm environment key failed schema validation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.results[0].msg ==
                "Container environment keys must be valid environment-variable identifiers and values must be scalar strings, numbers, " ~
                "booleans, or null."

    - name: Quadlet newline injection in command and parameter values is rejected
      block:
        - name: Validate newline-bearing command
          ansible.builtin.include_tasks: ../tasks/validate_blueprint.yml
          vars:
            iac_blueprint:
              podman:
                containers:
                  - image: example/image
                    quadlet: true
                    command: "run\nExecStart=/bin/evil"
                    parameters:
                      name: quadlet-injection
        - name: Fail if command injection was accepted
          ansible.builtin.fail:
            msg: "Quadlet command injection unexpectedly passed validation"
      rescue:
        - name: Confirm command injection was rejected precisely
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results[0].msg == "Quadlet content values must not contain newline or other control characters."

    - name: Quadlet record with unsupported parameter must be rejected
      block:
        - name: Validate unsupported Quadlet parameter
          ansible.builtin.include_tasks: ../tasks/validate_blueprint.yml
          vars:
            iac_blueprint:
              podman:
                containers:
                  - image: example/image
                    quadlet: true
                    parameters:
                      name: quadlet-invalid
                      privileged: true
        - name: Fail if unsupported Quadlet option was accepted
          ansible.builtin.fail:
            msg: "Unsupported Quadlet parameter unexpectedly passed validation"
      rescue:
        - name: Confirm unsupported Quadlet option was rejected
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.results[0].msg ==
                "Invalid container record: expected a mapping with supported fields, valid types, and safe Podman create parameters (including a valid name)."

    - name: Quadlet record with bootstrap options must be rejected
      block:
        - name: Validate Quadlet record with bootstrap service
          ansible.builtin.include_tasks: ../tasks/validate_blueprint.yml
          vars:
            iac_blueprint:
              podman:
                containers:
                  - image: example/image
                    quadlet: true
                    parameters:
                      name: quadlet-bootstrap-invalid
                    bootstrap_services: [sshd]
        - name: Fail if incompatible Quadlet bootstrap option was accepted
          ansible.builtin.fail:
            msg: "Quadlet bootstrap option unexpectedly passed validation"
      rescue:
        - name: Confirm Quadlet bootstrap option was rejected
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.results[0].msg ==
                "Invalid container record: expected a mapping with supported fields, valid types, and safe Podman create parameters (including a valid name)."

    - name: Non-boolean Quadlet value must be rejected
      block:
        - name: Validate non-boolean Quadlet value
          ansible.builtin.include_tasks: ../tasks/validate_blueprint.yml
          vars:
            iac_blueprint:
              podman:
                containers:
                  - image: example/image
                    quadlet: "true"
                    parameters:
                      name: quadlet-type-invalid
        - name: Fail if non-boolean Quadlet value was accepted
          ansible.builtin.fail:
            msg: "Non-boolean Quadlet value unexpectedly passed validation"
      rescue:
        - name: Confirm non-boolean Quadlet value was rejected
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.results[0].msg ==
                "Invalid container record: expected a mapping with supported fields, valid types, and safe Podman create parameters (including a valid name)."

    - name: Preset-injected privileged option must be rejected
      block:
        - name: Validate preset with unknown risky create option
          ansible.builtin.include_tasks: ../tasks/validate_blueprint.yml
          vars:
            podman_container_presets:
              risky:
                image: example/image
                parameters:
                  name: preset-derived-name
                  security_opt: [label=disable]
            iac_blueprint:
              podman:
                containers:
                  - preset: risky
        - name: Fail if preset-injected option was accepted
          ansible.builtin.fail:
            msg: "Preset-injected unsupported create option unexpectedly passed validation"
      rescue:
        - name: Confirm preset-injected option was rejected
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.results[0].msg ==
                "Invalid effective Podman create parameters: presets and container overrides must use supported keys and safe value types."

    - name: Malformed nested value must fail with specific message
      block:
        - name: Validate malformed parameter mapping
          ansible.builtin.include_tasks: ../tasks/validate_blueprint.yml
          vars:
            iac_blueprint:
              podman:
                containers:
                  - image: example/image
                    parameters:
                      name: valid-name
                      publish: {port: 80}
        - name: Fail if malformed input was accepted
          ansible.builtin.fail:
            msg: "Malformed nested parameter unexpectedly passed validation"
      rescue:
        - name: Confirm malformed parameter was rejected
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.results[0].msg ==
                "Invalid container record: expected a mapping with supported fields, valid types, and safe Podman create parameters (including a valid name)."

    - name: Unknown top-level key must fail with specific message
      block:
        - name: Validate unknown key
          ansible.builtin.include_tasks: ../tasks/validate_blueprint.yml
          vars:
            iac_blueprint:
              podman:
                unsupported: true
        - name: Fail if unknown key was accepted
          ansible.builtin.fail:
            msg: "Unknown blueprint key unexpectedly passed validation"
      rescue:
        - name: Confirm unknown key was rejected
          ansible.builtin.assert:
            that:
              - >-
                "Podman blueprint has an unsupported shape or key, or requested state is invalid. See
                docs/inventory-structure.md for accepted fields and states." in ansible_failed_result.msg

    - name: Empty image must fail during validate with the record error
      block:
        - name: Validate empty image
          ansible.builtin.include_tasks: ../tasks/validate_blueprint.yml
          vars:
            iac_blueprint:
              podman:
                containers:
                  - image: ""
                    parameters:
                      name: empty-image
        - name: Fail if empty image was accepted
          ansible.builtin.fail:
            msg: "Empty image unexpectedly passed validation"
      rescue:
        - name: Confirm empty image rejection
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.results[0].msg ==
                "Invalid container record: expected a mapping with supported fields, valid types, and safe Podman create parameters (including a valid name)."

    - name: Empty preset without effective preset data must fail during validate
      block:
        - name: Validate empty preset
          ansible.builtin.include_tasks: ../tasks/validate_blueprint.yml
          vars:
            iac_blueprint:
              podman:
                containers:
                  - preset: ""
        - name: Fail if empty preset was accepted
          ansible.builtin.fail:
            msg: "Empty preset unexpectedly passed validation"
      rescue:
        - name: Confirm empty preset rejection
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.results[0].msg ==
                "Invalid container record: expected a mapping with supported fields, valid types, and safe Podman create parameters (including a valid name)."

    - name: Null preset without an image must fail during validate
      block:
        - name: Validate null preset without image
          ansible.builtin.include_tasks: ../tasks/validate_blueprint.yml
          vars:
            iac_blueprint:
              podman:
                containers:
                  - preset: null
        - name: Fail if null preset without image was accepted
          ansible.builtin.fail:
            msg: "Null preset without image unexpectedly passed validation"
      rescue:
        - name: Confirm null preset without image rejection
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.results[0].msg ==
                "Invalid container record: expected a mapping with supported fields, valid types, and safe Podman create parameters (including a valid name)."

    - name: Preset with empty effective image must fail during validate
      block:
        - name: Validate preset with empty image
          ansible.builtin.include_tasks: ../tasks/validate_blueprint.yml
          vars:
            podman_container_presets:
              empty_image:
                image: ""
                parameters:
                  name: empty-preset-image
            iac_blueprint:
              podman:
                containers:
                  - preset: empty_image
        - name: Fail if empty preset image was accepted
          ansible.builtin.fail:
            msg: "Preset with empty image unexpectedly passed validation"
      rescue:
        - name: Confirm empty preset image rejection
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.results[0].msg ==
                "Invalid container record: expected a mapping with supported fields, valid types, and safe Podman create parameters (including a valid name)."
